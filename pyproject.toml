[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mibici"
version = "0.0.1"
description = "Entrega de la semana 5 con datos de MiBici"
authors = [
  { name = "Equipo32" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10.0"


[tool.ruff]
line-length = 99
src = ["mibici"]
include = ["pyproject.toml", "mibici/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mibici"]
force-sort-within-sections = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "datos: usa los Parquet reales de data/processed (se omite si no existen)",
    "lento: tarda más de unos segundos (entrena modelos o corre DeepChecks con datos reales)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:Mean of empty slice:RuntimeWarning",
    # Avisos informativos de MLflow al registrar conjuntos y firmas (no afectan las pruebas).
    "ignore:The specified dataset source can be interpreted:UserWarning",
    "ignore:Hint. Inferred schema contains integer column:UserWarning",
]

[tool.bandit]
# Las pruebas usan assert a propósito (B101); el análisis cubre el código del paquete y scripts.
exclude_dirs = ["tests", ".venv", "venv"]
